# Instance a, port 8989 — must match config-freemap.a.yml.
#
# The header is not decoration: it is how gh-update.sh confirms, through nginx,
# that the side it just switched to is the side answering. A port cannot be
# read back from outside, and a health check that only wants a 200 would be
# happy with the instance about to be retired.
add_header X-GH-Instance a always;
proxy_pass http://127.0.0.1:8989/;
