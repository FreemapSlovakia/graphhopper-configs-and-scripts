# Instance b, port 9989 — must match config-freemap.b.yml.
#
# The header is not decoration: it is how gh-update.sh confirms, through nginx,
# that the side it just switched to is the side answering. A port cannot be
# read back from outside, and a health check that only wants a 200 would be
# happy with the instance about to be retired.
#
# nginx inherits add_header from an outer level only while the inner one
# defines none, so this line takes `location /` off that inheritance. Nothing
# is lost today — neither http {} nor this vhost sets one — but an add_header
# added at either level later has to be repeated in both fragments, or it will
# silently stop reaching graphhopper.freemap.sk.
add_header X-GH-Instance b always;
proxy_pass http://127.0.0.1:9989/;
