graphhopper:
  # OpenStreetMap input file PBF or XML, can be changed via command line -Ddw.graphhopper.datareader.file=some.pbf
  datareader.file: "./run/extract.pbf"
  # Local folder used by graphhopper to store its data
  graph.location: graph-cache.b

  # Public transport. The presence of this key alone is what makes the whole
  # instance PT-capable: GraphHopperManaged builds a GraphHopperGtfs instead of
  # a GraphHopper when it is set, which adds /route-pt and /isochrone-pt and
  # makes ?profile=pt on /route forward to them (PtRedirectFilter). Speed mode
  # is unaffected -- postProcessing imports the timetable and then prepares CH
  # and LM exactly as before.
  #
  # Frozen paths, not run/gtfs/, for the reason the models are frozen: every
  # later run overwrites run/gtfs/, so a shared path would name files whose
  # contents have moved on from the timetable actually built into this graph.
  # gh-update.sh fetches the feeds and freeze-config.sh pins them here.
  #
  # The zips are read at import only. On a later start GtfsStorage.loadExisting
  # finds the timetable already in the graph, so an instance comes back even if
  # these files were removed -- though freeze-config.sh --check will not vouch
  # for a freeze that names them and does not have them.
  gtfs.file: run/instance.b/gtfs/zssk.zip,run/instance.b/gtfs/dpb.zip,run/instance.b/gtfs/presov.zip

  ##### Routing Profiles ####

  # Routing can be done only for profiles listed below. For more information about profiles and custom profiles have a
  # look into the documentation at docs/core/profiles.md or the examples under web/src/test/java/com/graphhopper/application/resources/
  # or the CustomWeighting class for the raw details.
  #
  # In general a profile consists of the following
  # - name (required): a unique string identifier for the profile
  # - weighting (optional): by default 'custom'
  # - turn_costs (optional):
  #     vehicle_types: [motorcar, motor_vehicle] (vehicle types used for vehicle-specific turn restrictions)
  #     u_turn_costs: 60 (time-penalty for doing a u-turn in seconds)
  #
  # Depending on the above fields there are other properties that can be used, e.g.
  # - custom_model_files: when you specified "weighting: custom" you need to set one or more json files which are searched in
  #   custom_models.directory or the working directory that defines the custom_model. If you want an empty model you can
  #   set "custom_model_files: []
  #   You can also use the `custom_model` field instead and specify your custom model in the profile directly.
  #
  # To prevent long running routing queries you should usually enable either speed or hybrid mode for all the given
  # profiles (see below). Or at least limit the number of `routing.max_visited_nodes`.

  profiles:
    - name: car
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      #     for more advanced turn costs, see #2957 or bike_tc.yml
      custom_model_files: [car.json, car_temporal.json]

    # You can use the following in-built profiles. After you start GraphHopper it will print which encoded values you'll have to add to graph.encoded_values in this config file.

    - name: car4wd
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
      custom_model_files: [car4wd.json, car_temporal.json]

    - name: foot
      custom_model_files: [fm_foot.json, foot_elevation.json, foot_carriageway.json, foot_temporal.json]

    - name: hike
      custom_model_files: [fm_hike.json, foot_elevation.json, foot_carriageway.json, foot_temporal.json]

    - name: bike
      custom_model_files: [bike.json, bike_elevation.json, bike_temporal.json]

    - name: racingbike
      custom_model_files: [racingbike.json, bike_elevation.json, bike_temporal.json]

    - name: mtb
      custom_model_files: [mtb.json, bike_elevation.json, bike_temporal.json]

    - name: motorcycle
      custom_model_files: [motorcycle.json, curvature.json, car_temporal.json]

    # Ours, from custom_models/. A file there may not be named after a built-in
    # one — GraphHopper resolves the jar's copy first and then refuses the
    # duplicate — so each is named after its profile.

    - name: carnotoll
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [car.json, carnotoll.json, car_temporal.json]

    - name: ebike
      custom_model_files: [bike.json, ebike.json, bike_temporal.json]

    - name: gravelbike
      custom_model_files: [bike.json, bike_elevation.json, gravelbike.json, bike_temporal.json]

    - name: stroller
      custom_model_files: [fm_foot.json, foot_elevation.json, stroller.json, foot_carriageway.json, foot_temporal.json]

    - name: easyhike
      custom_model_files: [fm_hike.json, foot_elevation.json, easyhike.json, foot_carriageway.json, foot_temporal.json]

  #    # See the bus.json for more details.
  #    - name: bus
  #       turn_costs:
  #         vehicle_types: [bus, motor_vehicle]
  #         u_turn_costs: 60
  #      custom_model_files: [bus.json]
  #
  #   Other custom models not listed here are: car4wd.json, motorcycle.json, truck.json or cargo-bike.json. You might need to modify and test them before production usage.
  #   See ./core/src/main/resources/com/graphhopper/custom_models and let us know if you customize them, improve them or create new onces!
  #   Also there is the curvature.json custom model which might be useful for a motorcyle profile or the opposite for a truck profile.
  #   Then specify a folder where to find your own custom model files:
  #
  # Not custom_models/ itself: the models are part of what a profile's stored
  # hash is checked against, so an instance has to read the copy frozen beside
  # its graph rather than the template this line lives in. See freeze-config.sh.
  custom_models.directory: run/instance.b/custom_models

  # Speed mode:
  # It's possible to speed up routing by doing a special graph preparation (Contraction Hierarchies, CH). This requires
  # more RAM/disk space for holding the prepared graph but also means less memory usage per request. Using the following
  # list you can define for which of the above routing profiles such preparation shall be performed. Note that to support
  # profiles with `turn_costs` a more elaborate preparation is required (longer preparation time and more memory
  # usage) and the routing will also be slower than with `turn_costs: false`.
  profiles_ch:
    - profile: car
    - profile: car4wd
    - profile: foot
    - profile: hike
    - profile: bike
    - profile: racingbike
    - profile: mtb
    - profile: motorcycle
    - profile: ebike
    - profile: gravelbike
    - profile: stroller
    - profile: easyhike

  # There is no sharing a contraction between profiles (unlike the landmarks
  # below), so each one above is contracted in full — but they are independent,
  # and the default of 1 runs them one after another. Threads trade the import's
  # RAM for its wall clock, and what scales with this number is the per-job
  # working set rather than the graph, which MMAP keeps on disk.
  #
  # 2, and now measured rather than assumed. On the first thirteen-profile
  # import the JVM peaked at 91.6 GiB RSS with its heap at 61 of the 64 GiB
  # -Xmx allows, while two edge-based contractions overlapped, and the host —
  # 251 GB with a ~100 GB postgis co-tenant — pushed 30 GB into swap doing it.
  # A third concurrent preparation would share that same heap, so this is the
  # ceiling without a larger -Xmx, and a larger -Xmx has nowhere to go here.
  #
  # car and car4wd carry turn costs, and their edge-based contraction is what
  # dominates: about 5 h each, against 15-62 min for a node-based one.
  prepare.ch.threads: 2

  # Hybrid mode:
  # Similar to speed mode, the hybrid mode (Landmarks, LM) also speeds up routing by doing calculating auxiliary data
  # in advance. Its not as fast as speed mode, but more flexible.
  #
  # Advanced usage: It is possible to use the same preparation for multiple profiles which saves memory and preparation
  # time. To do this use e.g. `preparation_profile: my_other_profile` where `my_other_profile` is the name of another
  # profile for which an LM profile exists. Important: This only will give correct routing results if the weights
  # calculated for the profile are equal or larger (for every edge) than those calculated for the profile that was used
  # for the preparation (`my_other_profile`)
  #
  # carnotoll rides on car's landmarks rather than contracting itself. Its own
  # edge-based contraction took 5.0 h on the first thirteen-profile import —
  # against 15 to 62 minutes for a node-based one — for a profile that is
  # car.json plus one clause multiplying priority by zero. That single
  # difference is also what makes the sharing legal: blocking an edge only ever
  # raises its weight, so carnotoll's weight is >= car's everywhere, which is
  # the condition stated above.
  #
  # It is cheap because LM preparation is node-based even for a profile with
  # turn costs — GraphHopper builds the landmark weighting with them stripped
  # and adds them back per query (createLMConfigs, and #1960 for why) — so it
  # never pays the edge-based penalty that made the contraction expensive.
  #
  # The cost is query speed: carnotoll is answered by landmarks rather than a
  # contraction, tens of milliseconds instead of about one. That is the right
  # trade for the least-travelled of the car profiles. car itself keeps its CH
  # and is unaffected; only the landmark set is shared.
  #
  # stroller and easyhike qualify on the same weight argument, but they cost 15
  # and 62 minutes to contract, so they stay in CH.
  profiles_lm:
    - profile: car
    - profile: carnotoll
      preparation_profile: car

  #### Encoded Values ####

  # Add additional information to every edge. Used for path details (#1548) and custom models (docs/core/custom-models.md)
  # Default values are: road_class,road_class_link,road_environment,max_speed,road_access
  # More are: surface,smoothness,max_width,max_height,max_weight,max_weight_except,hgv,max_axle_load,max_length,
  #           hazmat,hazmat_tunnel,hazmat_water,lanes,osm_way_id,toll,track_type,mtb_rating,hike_rating,horse_rating,
  #           country,curvature,average_slope,max_slope,car_temporal_access,bike_temporal_access,foot_temporal_access
  # Ours, beyond what the profiles need: get_off_bike, max_slope, smoothness,
  # toll, *_temporal_access, bike_colours, hiking_colours.
  #
  # get_off_bike and the two colour masks are read by nothing in this repo: no
  # custom model and no part of GraphHopper touches them, and they are here only
  # so the web app can ask for them as path details. Prune them as "unused" and
  # the import still succeeds — every details=hiking_colours request then fails
  # with a 400. The temporal ones mark conditional access as of the import day,
  # and {car,bike,foot}_temporal.json is what turns that into a block.
  graph.encoded_values: average_slope,bike_access,bike_average_speed,bike_colours,bike_priority,bike_road_access,bike_temporal_access,car_access,car_average_speed,car_temporal_access,country,curvature,foot_access,foot_average_speed,foot_network,foot_priority,foot_road_access,foot_temporal_access,get_off_bike,hike_rating,hiking_colours,max_slope,mtb_access,mtb_average_speed,mtb_priority,mtb_rating,racingbike_access,racingbike_average_speed,racingbike_priority,road_access,road_class,roundabout,smoothness,surface,toll,track_type

  #### Speed, hybrid and flexible mode ####

  # `prepare.ch.threads` is set beside `profiles_ch` above.

  # To tune the performance vs. memory usage for the hybrid mode use
  # prepare.lm.landmarks: 16

  # Make landmark preparation parallel if you have enough RAM. Change this only if you know what you are doing and if
  # the default worked for you.
  # prepare.lm.threads: 1

  #### Elevation ####

  # Sonny's LiDAR DTM, 1" (~30 m) tiles for Europe — far better than SRTM in the
  # mountains. GraphHopper cannot download these; the .hgt tiles are put in the
  # cache dir by hand. See sonny-tiles.md.
  graph.elevation.provider: sonny

  # Deliberately outside graph-cache.{a,b}: gh-update.sh wipes the graph dir of
  # the instance it rebuilds, and the ~4.8 GB of tiles must survive that. Shared
  # by both instances (only the import reads it, and imports never overlap).
  # Must be writable: GraphHopper keeps its decoded `dem*` cache next to the
  # tiles. Default would be /tmp/sonny.
  graph.elevation.cache_dir: ./sonny-dem/

  # 11.0 defaults this to true, which deletes the decoded `dem*` tile cache when
  # the import finishes, so the next import re-decodes all 1056 tiles again.
  # Upstream made false the default in 12.0 for exactly this reason.
  graph.elevation.clear: false

  # If you have a slow disk or plenty of RAM change the default MMAP to:
  # graph.elevation.dataaccess: RAM_STORE

  # To enable bilinear interpolation when sampling elevation at points (default uses nearest neighbor):
  graph.elevation.interpolate: bilinear

  # Reduce ascend/descend per edge without changing the maximum slope:
  # graph.elevation.edge_smoothing: ramer
  # removes elevation fluctuations up to max_elevation (in meter) and replaces the elevation with a value based on the average slope
  # graph.elevation.edge_smoothing.ramer.max_elevation: 5
  # Using an averaging approach for smoothing will reveal values not affected by outliers and realistic slopes and total altitude values (up and down)
  # graph.elevation.edge_smoothing: moving_average
  # window size in meter along a way used for averaging a node's elevation
  # graph.elevation.edge_smoothing.moving_average.window_size: 150

  # Long edge sampling, on for the sake of `max_slope`. `average_slope` comes
  # from an edge's two tower nodes and its length, so sampling cannot change it,
  # but SlopeCalculator derives `max_slope` by walking the pillar nodes — and a
  # long way that OSM maps without intermediate nodes has none, so `max_slope`
  # collapses to `average_slope` and the mid-edge ramp stroller.json and
  # easyhike.json look for is invisible. A point every 60 m gives them something
  # to see; below ~30 m there is no new information anyway, since that is the
  # Sonny cell.
  #
  # Requires the jar built per README "Building the jar", which cherry-picks
  # #3235 alongside the sonny provider. Stock 11.0 samples ferries too, and
  # limit.geojson reaches the Adriatic, the Baltic, the North Sea, the Aegean
  # and the Channel, so every ferry way in the graph would collect a point per
  # 60 m. Nothing here can detect a jar missing that commit — the import will
  # not complain, it will just produce a fatter graph — so the check lives in
  # that README section and has to be run at every jar bump.
  graph.elevation.long_edge_sampling_distance: 60

  # Below this the simplification pass drops a sampled point again for lying in
  # line with its neighbours. The unit is metres of *elevation*, not of ground
  # distance: RamerDouglasPeucker scales the vertical by maxWayPointDistance
  # divided by this, so a point survives exactly when it sits more than this
  # many metres off the chord. Unset it is Double.MAX_VALUE — elevation ignored
  # — and the 2D pass would throw away everything sampled above. Upstream
  # suggests 10, which keeps only 10 m bulges and so is far coarser than any
  # ramp worth routing around; 2 sits just above Sonny's vertical error and
  # keeps real structure without storing DEM jitter.
  #
  # Do not relax it to buy that back. At 5 the 150 m footway that is flat for
  # 100 m and then climbs at 8 % — the case stroller.json exists for — loses the
  # point at the foot of the ramp, which sits only 2.7 m off the chord, and
  # max_slope falls back to the 2.7 % average. 8 % ramps are the whole signal.
  #
  # The same key also sets the response geometry tolerance, so route polylines
  # get denser for every profile, including the ten that never read a slope. A
  # request can override it with elevation_way_point_max_distance, which is the
  # place to claw it back if the payloads bite.
  graph.elevation.way_point_max_distance: 2

  #### Country-dependent defaults for max speeds ####

  # This features sets a maximum speed in 'max_speed' encoded value if no maxspeed tag was found. It is country-dependent
  # and based on several rules. See https://github.com/westnordost/osm-legal-default-speeds
  # To use it uncomment the following, then enable urban density below and add 'country' to graph.encoded_values
  max_speed_calculator.enabled: true

  #### Urban density (built-up areas) ####

  # This feature allows classifying roads into 'rural', 'residential' and 'city' areas (encoded value 'urban_density')
  # Use 1 or more threads to enable the feature
  graph.urban_density.threads: 8
  # Use higher/lower sensitivities if too little/many roads fall into the according categories.
  # Using smaller radii will speed up the classification, but only change these values if you know what you are doing.
  # If you do not need the (rather slow) city classification set city_radius to zero.
  # graph.urban_density.residential_radius: 400
  # graph.urban_density.residential_sensitivity: 6000
  # graph.urban_density.city_radius: 1500
  # graph.urban_density.city_sensitivity: 1000

  #### Subnetworks ####

  # In many cases the road network consists of independent components without any routes going in between. In
  # the most simple case you can imagine an island without a bridge or ferry connection. The following parameter
  # allows setting a minimum size (number of edges) for such detached components. This can be used to reduce the number
  # of cases where a connection between locations might not be found.
  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1

  #### Routing ####

  # You can define the maximum visited nodes when routing. This may result in not found connections if there is no
  # connection between two points within the given visited nodes. The default is Integer.MAX_VALUE. Useful for flexibility mode
  # routing.max_visited_nodes: 1000000

  # default for snap_preventions
  routing.snap_preventions_default: tunnel, bridge, ferry

  # The maximum time in milliseconds after which a routing request will be aborted. This has some routing algorithm
  # specific caveats, but generally it should allow the prevention of long-running requests. The default is Long.MAX_VALUE
  routing.timeout_ms: 30000

  # Control how many active landmarks are picked per default, this can improve query performance
  # routing.lm.active_landmarks: 4

  # You can limit the max distance between two consecutive waypoints of flexible routing requests to be less or equal
  # the given distance in meter. Default is set to 1000km.
  #
  # Raised off that 1000 km default because carnotoll is answered by landmarks
  # rather than a contraction now (see profiles_lm). The check sits in
  # FlexSolver, which LMSolver extends; CHSolver does not inherit it. So this
  # limit applied to nothing while every profile was contracted, and at 1000 km
  # it would start refusing a carnotoll leg longer than that while the same
  # request still worked for car. The extract spans Europe, so 6000 km clears
  # its diagonal, and routing.timeout_ms above is the real bound on what one
  # expensive query is allowed to cost.
  routing.non_ch.max_waypoint_distance: 6000000

  #### Storage ####

  # Excludes certain types of highways during the OSM import to speed up the process and reduce the size of the graph.
  # A typical application is excluding 'footway','cycleway','path' and maybe 'pedestrian' and 'track' highways for
  # motorized vehicles. This leads to a smaller and less dense graph, because there are fewer ways (obviously),
  # but also because there are fewer crossings between highways (=junctions).
  # Another typical example is excluding 'motorway', 'trunk' and maybe 'primary' highways for bicycle or pedestrian routing.
  # import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps # typically useful for motorized-only routing
  # import.osm.ignored_highways: motorway,trunk # typically useful for non-motorized routing
  import.osm.ignored_highways: []

  # configure the memory access, use RAM_STORE for well equipped servers (default and recommended)
  graph.dataaccess.default_type: MMAP

  # will write way names in the preferred language (language code as defined in ISO 639-1 or ISO 639-2):
  # datareader.preferred_language: en

  #### Custom Areas ####

  # GraphHopper reads GeoJSON polygon files including their properties from this directory and makes them available
  # to all tag parsers and custom models. All GeoJSON Features require to have the "id" property.
  # Country borders are included automatically (see countries.geojson).
  # custom_areas.directory: path/to/custom_areas

  #### Country Rules ####

  # GraphHopper applies country-specific routing rules during import (not enabled by default).
  # You need to redo the import for changes to take effect.
  country_rules.enabled: true

# Dropwizard server configuration
server:
  application_connectors:
    - type: http
      port: 9989
      # for security reasons bind to localhost
      bind_host: localhost
      # increase GET request limit - not necessary if /maps UI is not used or used without custom models
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 9990
      bind_host: localhost
# See https://www.dropwizard.io/en/latest/manual/core.html#logging
logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  loggers:
    "com.graphhopper.osm_warnings":
      level: DEBUG
